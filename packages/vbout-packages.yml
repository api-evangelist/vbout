description: >-
  VBOUT client libraries and platform plugins. The developer portal states
  "Currently we only support PHP code libraries to interact with our API" and
  links the official PHP helper library (hosted on the API team's GitHub
  account, irajab). First-party platform plugins are published on WordPress.org
  (author: vbout) and the vbout GitHub org (Magento). Community/integration
  packages found on Packagist and npm are recorded as unofficial. No PyPI,
  RubyGems, Maven, NuGet, Go, or crates.io packages found (pypi.org/pypi/vbout
  returned 404; registry searches checked 2026-07-21).
