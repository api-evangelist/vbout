  Limits" against the documented 15 requests/second ceiling; (2) the published
  monthly prices move with an email-volume slider (500 → 100K emails/month), so
  the same plan card renders $50 at the 500-email setting and $199 at a higher
  setting. Both observed values are recorded rather than one being picked.
