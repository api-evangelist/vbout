      x-rate-limit-requests / x-rate-limit-remaining / x-rate-limit-reached /
      x-rate-limit-reset / x-rate-limit-after headers plus a rate-limit JSON
      object on every response (vendor header names, not the IETF
      RateLimit-Policy draft).
  - id: json-api
    conforms: false
    evidence: Vendor envelope, not JSON:API media type.
  - id: scim
    conforms: false
    evidence: No SCIM paths; user management is the proprietary User/* family.
