standards:
  - id: openapi-3.1
    conforms: true
    evidence: Provider publishes OpenAPI 3.1.0 at https://developers.vbout.com/scripts/openapi.json (rendered by ReDoc) and a second 3.1.0 document at https://vbout.com/.well-known/openapi.yaml.
  - id: oauth2
    conforms: partial
    evidence: >-
      OAuth authorization for third-party apps exists (VBOUT Connect;
      ai-plugin.json declares auth type oauth with authorization_url
      https://app.vbout.com/Authorize) but no RFC 8414 metadata, no token
      endpoint documentation, and an empty scope catalog. Primary auth is a
      static API key.
  - id: oidc
    conforms: false
    evidence: /.well-known/openid-configuration returns 404 on www and developers hosts; api.vbout.com serves a soft-200 catch-all.
  - id: rfc9457-problem-details
    conforms: false
    evidence: Errors use a vendor envelope (response.header.status + response.data.errorCode/errorMessage), not application/problem+json.
  - id: rfc9116-security-txt
    conforms: false
    evidence: /.well-known/security.txt returns 404 on www and developers hosts.
  - id: pagination
    conforms: partial
    evidence: page/limit parameters on EmailMarketing/Campaigns and SocialMedia/Calendar only; other list endpoints are unpaginated.
  - id: idempotency
    conforms: false
    evidence: No idempotency-key mechanism documented; EmailMarketing/SyncContact provides upsert semantics only.
  - id: rate-limit-signaling
    conforms: true
    evidence: >-
