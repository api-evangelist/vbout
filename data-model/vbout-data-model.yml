entities:
- name: Account
  description: The VBOUT business account (App/Me); owns every other object.
- name: Contact
  description: A person/lead in email marketing lists.
- name: List
  description: A contact list with custom fields.
- name: Audience
  description: A grouping of lists/contacts (EmailMarketing/GetAudiences).
- name: Campaign
  description: An email marketing campaign.
- name: EmailTemplate
  description: Reusable email template (GetEmailTemplates).
- name: Tag
  description: Label applied to contacts (AddTag/RemoveTag by email).
- name: Activity
  description: Custom activity appended to a contact timeline.
- name: SocialPost
  description: A scheduled/published social media post.
- name: Channel
  description: A connected social media channel (Facebook, X, LinkedIn, ...).
- name: Goal
  description: A conversion goal tracked on a domain.
- name: Domain
  description: A tracked website domain.
- name: Popup
  description: On-site engagement action (the Webhook/* operation family manages popups/sticky bars).
- name: User
  description: A sub-user of the account (Users & Workflow).
- name: Group
  description: A group of users.
- name: Coupon
  description: Coupon code surfaced to email campaigns (GetCoupon).
- name: CustomShortcode
  description: Custom merge shortcode (Settings family).
- name: Automation
  description: Marketing automation built from a guide (Automation family).
- name: PipelineBoard
  description: CRM pipeline board built from a guide (Pipeline family).
- name: AIChatbotTemplate
  description: AI chatbot template (AIchatbot family).
