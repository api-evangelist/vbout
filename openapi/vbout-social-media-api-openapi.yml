      operationId: get-SocialMedia-post
      description: "**Authentication:** `Required`    \n  - - -  \n  \n**Response Formats:** `XML | JSON`"
      parameters:
      - schema:
          type: integer
          default: none
        in: query
        name: ID
        description: The id of the post<br>**Possible values:** (ID)
        required: true
      - schema:
          type: string
          default: none
