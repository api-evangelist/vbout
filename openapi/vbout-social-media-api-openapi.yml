openapi: 3.1.0
info:
  title: VBOUT EmailMarketing Social Media API
  version: '1.0'
  description: VBOUT Features API documentation
servers:
- url: https://api.vbout.com/1
tags:
- name: Social Media
paths:
  SocialMedia/Channels:
    get:
      summary: Channels
      tags:
      - Social Media
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    channels:
                      Facebook:
                        count: 1
                        pages:
                        - id: '510584708978405'
                          name: Spotless TV
                      Twitter:
                        count: 1
                        profiles:
                        - id: '333248756'
                          screenname: Hugoo236
                          fullname: Hugo First
                      Linkedin:
                        count: 0
                        profiles: []
                properties:
                  channels:
                    type: object
                    properties:
                      Facebook:
                        type: object
                        properties:
                          count:
                            type: integer
                          pages:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                      Twitter:
                        type: object
                        properties:
                          count:
                            type: integer
                          profiles:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                screenname:
                                  type: string
                                fullname:
                                  type: string
                      Linkedin:
                        type: object
                        properties:
                          count:
                            type: integer
                          profiles:
                            type: array
                            items: {}
              examples:
                example-1:
                  value:
                    channels:
                      Facebook:
                        count: 1
                        pages:
                        - id: '510584708978405'
                          name: Spotless TV
                      Twitter:
                        count: 1
                        profiles:
                        - id: '333248756'
                          screenname: Oli16
                          fullname: Olive Tree
                      Linkedin:
                        count: 0
                        profiles: []
      operationId: get-SocialMedia-Channels
      description: "**Authentication:** `Required`    \n  - - -  \n  \n**Response Formats:** `XML | JSON`  \n - - -  \n **Parameters:** `None`"
      x-codeSamples:
      - lang: cURL
        source: GET https://api.vbout.com/1/socialmedia/channels.json?key={YOUR_API_ID}
      - lang: PHP
        source: '<?php

          require_once(''../PATH/TO/services/SocialMediaWS.php'');

          $user_key = array(''api_key'' => ''{YOUR_API_KEY}'');

          $app = new SocialMediaWS($user_key);

          $results = $app->getChannels();

          print_r($results);

          ?>

          '
