  note: >-
    The nearest thing to a safe trial surface is the 14-day free trial on the
    pricing page — but API Access is not included below the Professional tier
    (see plans/vbout-plans-pricing.yml), so a developer cannot exercise the API
    during a Free-tier evaluation at all.
