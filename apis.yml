aid: vbout
name: VBOUT
description: >-
  VBOUT is an AI-enabled marketing automation platform used by agencies and
  small-to-mid-size businesses to run email marketing, social media
  scheduling, landing pages, popups, lead scoring, and an AI chatbot from one
  place. The VBOUT REST API (v1.0 at api.vbout.com/1) exposes the platform
  programmatically — contacts, lists, audiences, email campaigns and stats,
  social channels, calendar and posts, conversion goals, sub-users and groups,
  on-site engagement actions, automations, pipeline boards, and account
  settings — authenticated with an account API key, with responses in JSON or
  XML and a documented 15 requests/second rate limit. VBOUT is a 500 Global
  portfolio company.
